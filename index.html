<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon Typewriter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap">
<style>
:root{
  color-scheme: dark;
  /* Layout: full-bleed WebGL stage; brass-edged status plate top-left; instrument drawer docked right (bottom sheet on phones) */
  --bg:#0b0a09;
  --panel:rgba(19,17,15,.9);
  --panel-edge:#302a24;
  --ink:#ebe3d3;
  --muted:#9d9281;
  --brass:#caa45d;
  --brass-deep:#6f5a32;
  --ribbon-red:#c4493b;
  --f-display:"Special Elite","Courier New",Courier,monospace;
  --f-ui:"Courier Prime","Courier New",Courier,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}


.toggle{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  font:700 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:rgba(15,13,11,.55);
  border:1px solid rgba(202,164,93,.22);border-radius:3px;padding:8px 12px;cursor:pointer;transition:color .2s,border-color .2s}
.toggle:hover{color:var(--brass);border-color:var(--brass-deep)}
.toggle.kb{display:none;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.toolbar{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toolbar .toggle{position:static}
.toggle.warn,.toggle.warn:hover{color:var(--ribbon-red);border-color:var(--ribbon-red)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{font:700 12px var(--f-ui);letter-spacing:.06em;color:var(--ink);background:#1d1a17;border:1px solid #3a332b;border-radius:3px;padding:8px 10px;cursor:pointer;flex:1 1 auto}
.btn:hover{border-color:var(--brass-deep);background:#24201b}
.btn.primary{background:var(--brass);color:#16120b;border-color:var(--brass)}
.btn.primary:hover{background:#d8b36c}
.btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
kbd{font:700 11px var(--f-ui);border:1px solid #4a4137;border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink);background:#1e1b17}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;
  font-size:12px;color:var(--muted);letter-spacing:.04em;pointer-events:none;max-width:calc(100% - 32px);line-height:1.5;text-align:center;transition:opacity 1.2s}
#hint.gone{opacity:0}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;z-index:25;
  font:700 13px var(--f-ui);letter-spacing:.04em;background:#1c1915;color:var(--ink);border:1px solid var(--brass-deep);border-radius:3px;
  padding:9px 14px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 48px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#modal{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.82);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .sheet{background:var(--panel);border:1px solid var(--panel-edge);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:min(340px,100%);max-width:min(720px,100%);max-height:100%;box-sizing:border-box}
#modal img{max-width:100%;max-height:62vh;object-fit:contain;border-radius:2px;background:#000;display:block;margin:0 auto}
#modal h3{margin:0;font:700 13px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
#modal .note{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
#modal .btn:disabled{opacity:.55;cursor:default}

#loader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;transition:opacity .6s}
#loader p{margin:0;font-family:var(--f-display);font-size:20px;color:var(--ink);letter-spacing:.04em}
#loader small{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#loader.gone{opacity:0;pointer-events:none}
#softkb{position:fixed;left:-200px;top:0;width:60px;height:30px;opacity:0;font-size:16px}

@media (max-width:760px){
  .toggle.kb{display:block;left:max(16px,env(safe-area-inset-left,0px));right:auto;top:calc(16px + env(safe-area-inset-top,0px));bottom:auto}
  #hint{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#toast,#loader{transition:none}}
</style>
</head>
<body>

<canvas id="gl" tabindex="0" aria-label="Three-dimensional typewriter. Type on your keyboard to use it."></canvas>
<div class="vignette"></div>


<div class="toolbar">
  <button class="toggle" id="newPaperBtn">New paper</button>
  <button class="toggle" id="saveScanBtn">Save page</button>
</div>
<button class="toggle kb" id="kbBtn">Keyboard</button>


<p id="hint">Start typing. <kbd>Enter</kbd> returns the carriage &middot; drag to look around &middot; scroll on the page to roll it</p>
<div id="toast" role="status" aria-live="polite"></div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Preview</h3>
    <img id="modalImg" alt="Preview of the typed page">
    <p class="note" id="modalNote"></p>
    <div class="row">
      <button class="btn" id="modalClose">Back to the machine</button>
      <button class="btn primary" id="modalDownload">Download</button>
    </div>
  </div>
</div>

<div id="loader"><p>Threading the ribbon&hellip;</p><small id="loadMsg">Loading type and steel</small></div>
<textarea id="softkb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Typewriter input for touch keyboards"></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('loadMsg').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }
const T = THREE;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise2D(seed){
  const rnd = mulberry32(seed), perm = new Uint8Array(512), G = new Float32Array(256);
  const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) G[i] = rnd();
  const h = (x, y) => G[perm[(perm[x & 255] + y) & 255]];
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
}
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ============================== constants ============================== */
const DPI = 200, PW = 1700, PH = 2200;               // 8.5 x 11 in at 200 dpi
const CM_PER_PX = 2.54 / DPI;
const PAPER_W = 8.5 * 2.54, PAPER_H = 11 * 2.54;
const LINE_PX = DPI / 6;                           // six lines to the inch
const PLATEN = { y: 13, z: -7, r: 1.8, half: 15 };
const A0 = 5 * DEG;                                // print point angle on the platen
const RP = PLATEN.r + 0.025;                       // paper radius
const P = new T.Vector3(0, PLATEN.y + RP * Math.sin(A0), PLATEN.z + RP * Math.cos(A0));
const SEG_C = new T.Vector3(0, P.y - 2.5, P.z);    // typebar segment centre
const SEG_R = 5;
const FAM = { worn: '"Special Elite", "Courier New", monospace', clean: '"Courier Prime", "Courier New", monospace' };
const INK = { black: [22, 20, 30], red: [170, 30, 26], stencil: [196, 191, 182] };
const RIBBON_NAME = { black: 'Black', red: 'Red', stencil: 'Stencil' };
const PAPER_STYLES = {
  bond:  { base: [245, 243, 236], grain: 10, mottle: .20, fibers: 2400, aged: 0,   laid: false, droop: .08, back: 0xd8d5cc, opacity: 1, cockle: .015 },
  ivory: { base: [237, 225, 199], grain: 12, mottle: .34, fibers: 2700, aged: 1,   laid: false, droop: .10, back: 0xcfc2a5, opacity: 1, cockle: .03 },
  laid:  { base: [241, 234, 215], grain: 9,  mottle: .24, fibers: 1900, aged: .3,  laid: true,  droop: .06, back: 0xd3cab4, opacity: 1, cockle: .015 },
  onion: { base: [240, 239, 233], grain: 7,  mottle: .42, fibers: 3400, aged: 0,   laid: false, droop: .34, back: 0xdcdad2, opacity: .9, cockle: .06 }
};

/* ============================== state ============================== */
const S = {
  cpi: 10, face: 'worn', ribbon: 'black', spacing: 1,
  leftM: 10, rightM: 75, marRel: false, tabs: new Set([15, 40]),
  col: 10, feedPx: 0, feedVis: 0, firstLine: 0,
  paperIn: true, paperStyle: 'ivory', paperAnim: false,
  shift: false, lock: false, autoShiftUntil: 0,
  jamOn: true, jammed: false, pending: 0, lastStrike: null,
  returning: false, queue: [], carX: 0, carOverride: false, shiftVis: 0,
  ribbonUse: 0, view: 'typist'
};
const cell = () => DPI / S.cpi;
const maxCol = () => Math.floor(PW / cell()) - 1;
const paperLocalX = col => -PAPER_W / 2 + (col * cell() + cell() / 2) * CM_PER_PX;

/* ============================== renderer & scene ============================== */
const canvas = $('#gl');
let renderer;
try {
  renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
} catch (e) { $('#loadMsg').textContent = 'WebGL is not available in this browser.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new T.Scene();
scene.background = new T.Color(0x0a0908);
scene.fog = new T.Fog(0x0a0908, 110, 230);
const camera = new T.PerspectiveCamera(34, 1, 0.5, 500);

function buildEnv(){
  const es = new T.Scene();
  const room = new T.Mesh(new T.BoxGeometry(80, 50, 80), new T.MeshBasicMaterial({ color: new T.Color(.012, .011, .01), side: T.BackSide }));
  room.position.y = 18; es.add(room);
  const panel = (w, h, c, x, y, z) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 8, 0); es.add(m); };
  panel(15, 8, new T.Color(5, 4, 3), -20, 30, 16);        // lamp softbox
  panel(3, 26, new T.Color(.7, .85, 1.1), 30, 16, -8);    // window strip
  panel(30, 2, new T.Color(1.1, 1.05, .95), 0, 34, -26);  // ceiling strip
  panel(8, 6, new T.Color(.5, .42, .34), 14, 24, 28);
  const fl = new T.Mesh(new T.PlaneGeometry(80, 80), new T.MeshBasicMaterial({ color: new T.Color(.16, .09, .05) }));
  fl.rotation.x = -Math.PI / 2; fl.position.y = -2; es.add(fl);
  const pm = new T.PMREMGenerator(renderer);
  const tex = pm.fromScene(es, 0.025).texture; pm.dispose();
  return tex;
}
scene.environment = buildEnv();

/* lights */
scene.add(new T.HemisphereLight(0x2a2d36, 0x120c07, 0.55));
const lamp = new T.SpotLight(0xffd6a6, 2.3, 0, 0.52, 0.75, 1.2);
lamp.position.set(-24, 52, 30); lamp.target.position.set(0, 9, -3);
lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.bias = -0.00025; lamp.shadow.normalBias = 0.03;
lamp.shadow.camera.near = 20; lamp.shadow.camera.far = 140; lamp.shadow.radius = 4;
scene.add(lamp, lamp.target);
const fill = new T.DirectionalLight(0x8ea5c9, 0.32); fill.position.set(40, 22, 8); scene.add(fill);
const rim = new T.DirectionalLight(0xffe4bd, 0.55); rim.position.set(6, 30, -40); scene.add(rim);

/* ============================== procedural textures ============================== */
function woodCanvas(){
  const W = 1024, H = 1024, c = mkCanvas(W, H), ctx = c.getContext('2d');
  const id = ctx.createImageData(W, H), d = id.data, n1 = makeNoise2D(7), n2 = makeNoise2D(19), n3 = makeNoise2D(31);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const warp = n1(x / 260, y / 70) * 7 + n2(x / 60, y / 18) * 0.8;
    const g = Math.sin((y / H * 54 + warp) * Math.PI);
    const ring = Math.pow(0.5 + 0.5 * g, 2.4);
    const fine = n3(x / 30, y * 0.9);
    const plank = (y % 341) < 2 ? 0.55 : 1;
    let t = clamp(0.25 + ring * 0.45 + (fine - 0.5) * 0.35 + (n2(x / 400, y / 400) - 0.5) * 0.4, 0, 1);
    const i = (y * W + x) * 4;
    d[i] = lerp(30, 86, t) * plank; d[i + 1] = lerp(17, 52, t) * plank; d[i + 2] = lerp(10, 30, t) * plank; d[i + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  return c;
}
function feltCanvas(){
  const W = 512, c = mkCanvas(W, W), ctx = c.getContext('2d'), id = ctx.createImageData(W, W), d = id.data, n = makeNoise2D(5);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const v = 30 + (Math.random() - .5) * 16 + (n(x / 40, y / 40) - .5) * 10;
    const i = (y * W + x) * 4; d[i] = v * 0.95; d[i + 1] = v * 1.02; d[i + 2] = v * 0.92; d[i + 3] = 255;
  }
  ctx.putImageData(id, 0, 0); return c;
}
function toTex(c, srgb = true){ const t = new T.CanvasTexture(c); if (srgb) t.encoding = T.sRGBEncoding; t.anisotropy = MAX_ANISO; return t; }

/* ============================== materials ============================== */
const M = {
  enamel: new T.MeshPhysicalMaterial({ color: 0x040405, roughness: 0.5, metalness: 0.0, clearcoat: .85, clearcoatRoughness: 0.05, envMapIntensity: 0.38 }),
  enamelSoft: new T.MeshStandardMaterial({ color: 0x050506, roughness: 0.78, metalness: 0, envMapIntensity: .22 }),
  chrome: new T.MeshStandardMaterial({ color: 0xeeeeee, metalness: 1, roughness: 0.12, envMapIntensity: 1.6 }),
  steel: new T.MeshStandardMaterial({ color: 0x8c8c90, metalness: 1, roughness: 0.36 }),
  darkSteel: new T.MeshStandardMaterial({ color: 0x3a3a3e, metalness: .9, roughness: .45 }),
  rubber: new T.MeshStandardMaterial({ color: 0x111111, roughness: 0.62, metalness: 0 }),
  bakelite: new T.MeshPhysicalMaterial({ color: 0x0b0b0b, roughness: 0.28, clearcoat: .7, clearcoatRoughness: .15 }),
  glass: new T.MeshPhysicalMaterial({ color: 0x0c0c0e, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.2, envMapIntensity: .7, clearcoat: 1, clearcoatRoughness: 0.02, depthWrite: false }),
  felt: null, wood: null
};
const wood = woodCanvas();
const woodTex = toTex(wood); woodTex.wrapS = woodTex.wrapT = T.RepeatWrapping; woodTex.repeat.set(2.2, 1.6);
M.wood = new T.MeshStandardMaterial({ map: woodTex, roughness: 0.62, metalness: 0 });
const feltTex = toTex(feltCanvas()); feltTex.wrapS = feltTex.wrapT = T.RepeatWrapping; feltTex.repeat.set(5, 5);
M.felt = new T.MeshStandardMaterial({ map: feltTex, roughness: 1 });

function sh(mesh, cast = true, recv = true){ mesh.castShadow = cast; mesh.receiveShadow = recv; return mesh; }
function roundRectShape(x0, y0, x1, y1, r){
  const s = new T.Shape();
  s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.quadraticCurveTo(x1, y0, x1, y0 + r);
  s.lineTo(x1, y1 - r); s.quadraticCurveTo(x1, y1, x1 - r, y1); s.lineTo(x0 + r, y1);
  s.quadraticCurveTo(x0, y1, x0, y1 - r); s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
  return s;
}

/* ============================== room ============================== */
const desk = sh(new T.Mesh(new T.PlaneGeometry(220, 150), M.wood), false, true);
desk.rotation.x = -Math.PI / 2; scene.add(desk);
const matGeo = new T.ExtrudeGeometry(roundRectShape(-24, -19, 24, 19, 2.2), { depth: 0.25, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.08, bevelSegments: 2 });
matGeo.rotateX(-Math.PI / 2);
const mat = sh(new T.Mesh(matGeo, M.felt), false, true); mat.position.set(0, 0.05, 1); scene.add(mat);

/* ============================== typewriter body ============================== */
const tw = new T.Group(); tw.position.y = 0.85; scene.add(tw);

// base pan
{
  const g = new T.ExtrudeGeometry(roundRectShape(-15.7, -13.1, 15.7, 13.3, 1.2), { depth: 1.2, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.2, bevelSegments: 3, curveSegments: 8 });
  g.rotateX(-Math.PI / 2); g.translate(0, 0.2, 0);
  tw.add(sh(new T.Mesh(g, M.enamel)));
  // flip z of rotated shape: shape y -> -z, so mirror
  for (const [x, z] of [[-13.5, 11], [13.5, 11], [-13.5, -11], [13.5, -11]]) {
    const f = sh(new T.Mesh(new T.CylinderGeometry(1.1, 1.25, 0.9, 24), M.rubber)); f.position.set(x, -0.35, z); tw.add(f);
  }
}
// side plates
const SIDE_PROFILE = (() => {
  const s = new T.Shape();
  s.moveTo(13.2, 0); s.lineTo(13.2, 2.3); s.quadraticCurveTo(13.1, 2.95, 12.3, 3.15);
  s.lineTo(3.5, 7.1); s.quadraticCurveTo(1.0, 8.2, 0.3, 9.9); s.quadraticCurveTo(-0.2, 10.6, -1.2, 10.6);
  s.lineTo(-12.2, 10.6); s.quadraticCurveTo(-13, 10.6, -13, 9.8); s.lineTo(-13, 0); s.lineTo(13.2, 0);
  return s;
})();
for (const side of [-1, 1]) {
  const g = new T.ExtrudeGeometry(SIDE_PROFILE, { depth: 0.9, bevelEnabled: true, bevelThickness: 0.22, bevelSize: 0.2, bevelSegments: 4, curveSegments: 16 });
  const m = sh(new T.Mesh(g, M.enamel)); m.rotation.y = -Math.PI / 2;
  m.position.x = side < 0 ? -14.6 : 15.5; tw.add(m);
}
// front apron, rear panel
{ const a = sh(new T.Mesh(new T.BoxGeometry(29.6, 2.3, 0.6), M.enamel)); a.position.set(0, 1.15, 13.05); tw.add(a);
  const r = sh(new T.Mesh(new T.BoxGeometry(29.2, 10.3, 0.5), M.enamel)); r.position.set(0, 5.2, -12.85); tw.add(r); }
// comb plate (sloped bank under the keys) and key-lever cover
const plateY = z => 2.25 + (12.6 - z) / 9.6 * 4.05;
{
  const len = Math.hypot(9.6, 4.05), a = Math.atan2(4.05, 9.6);
  const m = sh(new T.Mesh(new T.BoxGeometry(29.2, 0.2, len), M.enamelSoft)); m.position.set(0, plateY(7.8), 7.8); m.rotation.x = a; tw.add(m);
  const len2 = Math.hypot(3.2, 3.85), a2 = Math.atan2(3.85, 3.2);
  const m2 = sh(new T.Mesh(new T.BoxGeometry(29.2, 0.2, len2), M.enamel)); m2.position.set(0, (6.3 + 10.15) / 2, 1.4); m2.rotation.x = a2; tw.add(m2);
}
// deck with the typebar opening
{
  const NR = 6.5, cz = SEG_C.z, fz = -0.2;

function keyLabelTex(def){
  const c = mkCanvas(128, 128), x = c.getContext('2d');

  if (def.sp) {
    const lines = def.lab.split('\n'); x.font = `700 ${lines.length > 1 ? 23 : 26}px "Courier Prime", monospace`;
    lines.forEach((l, i) => x.fillText(l, 64, 64 + (i - (lines.length - 1) / 2) * 26));
  } else if (/^[a-z]$/.test(def.lo)) {
    x.font = '700 64px "Courier Prime", monospace'; x.fillText(def.hi, 64, 68);

}

  const dome = new T.Mesh(domeGeo, M.glass); dome.position.y = (0.26 - 2.23) * sc; dome.scale.setScalar(sc); cap.add(dome);

function updateRibbon(force){
  const target = RIB.liftTarget;
  if (!force && Math.abs(RIB.lift - target) < 1e-4) return;
  RIB.lift = target;
  const N = ribbonMesh.userData.N, rows = ribbonMesh.userData.rows;
  for (let i = 0; i < N; i++) {
    const x = -RIB.half + (2 * RIB.half) * i / (N - 1);
    const ax = Math.abs(x); const bump = ax < 1.0 ? 1 : Math.pow(Math.max(0, 1 - (ax - 1.0) / 5.5), 2);
    const yc = RIB.y0 + RIB.lift * bump;
    for (let r = 0; r < 4; r++) { const v = (i * 4 + r) * 3; ribbonPos[v] = x; ribbonPos[v + 1] = yc + rows[r] * RIB.w; ribbonPos[v + 2] = RIB.z - 0.06 * (1 - bump) * 0; }
  }
  ribbonMesh.geometry.attributes.position.needsUpdate = true; ribbonMesh.geometry.computeVertexNormals();
  vibrator.position.y = RIB.y0 + RIB.lift;
}

/* ============================== UI helpers ============================== */
let toastT = 0;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }
function refreshReadout(){ /* no on-screen readout */ }
function setSeg(name, v){ document.querySelectorAll(`.seg[data-set="${name}"] button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v)))); }

/* ============================== typing mechanics ============================== */
const UP_MS = 55, DOWN_MS = 125, JAM_MS = 32;
const keyPan = key => clamp((key.x || 0) / 14, -1, 1) * .5;
const shiftOn = () => S.shift || S.lock;

  const key = map.key, bar = key.bar, now = performance.now();

  }

  if (S.jamOn && src === 'kbd' && prev && prev.bar !== bar && prev.bar.phase === 'up' && now - prev.t < JAM_MS) { doJam(prev.bar, bar); return; }
  S.lastStrike = { bar, t: now };
  pressKeyVisual(key, UP_MS + 60);
  bar.phase = 'up'; bar.t0 = now; bar.ch = map.shifted ? key.hi : key.lo; bar.printed = false; S.pending++;
  const k = 0.94 + ((key.x + 14) / 28) * 0.12;
  Snd.keyDown(keyPan(key), k);
  const onPaper = S.paperIn && S.feedPx > 6 && S.feedPx < PH - 4;
  Snd.strike(keyPan(key) * .6, k + rand(-.02, .02), UP_MS / 1000, onPaper, rand(.9, 1.05));

}
function impact(bar){
  bar.printed = true; S.pending = Math.max(0, S.pending - 1);
  printGlyph(bar.ch, S.col, S.feedPx);
  advance(1, true);
  spools.forEach((s, i) => s.rotation.y += (i ? -1 : 1) * 0.03);
}
function advance(n, ring){
  const before = S.col; S.col = clamp(S.col + n, 0, maxCol() + 1);
  const bellCol = S.rightM - 6;
  if (ring && before < bellCol && S.col >= bellCol) Snd.bell(0.02);
  refreshReadout();
}
function doJam(a, b){
  S.jammed = true; S.lastStrike = null;
  for (const [bar, ang] of [[a, .2], [b, .34]]) {
    if (bar.phase === 'up') S.pending = Math.max(0, S.pending - 1);
    bar.phase = 'jam'; bar.jamAt = ang; bar.jamFrom = bar.angle; bar.t0 = performance.now();
  }
  pressKeyVisual(b.key, 80); Snd.keyDown(keyPan(b.key)); Snd.jam();
  toast('Typebars jammed. Press Esc or click the tangle to free them.');
}
function clearJam(){
  if (!S.jammed) return;
  S.jammed = false; for (const b of bars) if (b.phase === 'jam') { b.phase = 'down'; b.t1 = performance.now(); b.fromAngle = b.angle; }
  Snd.unjam();
}
function space(q){
  Snd.init();
  if (mustWait(q === true, true)) { S.queue.push(() => space(true)); return; }
  const k = keyBy('space')[0]; pressKeyVisual(k, 90);
  if (S.col + S.pending >= limitCol()) { Snd.locked(0); return; }
  Snd.space(); advance(1, true);
}
function backspace(q){
  Snd.init();
  if (mustWait(q === true, true)) { S.queue.push(() => backspace(true)); return; }
  const k = keyBy('back')[0]; pressKeyVisual(k, 100);
  const min = (S.marRel || S.col < S.leftM) ? 0 : S.leftM;

  Snd.back(keyPan(k)); advance(-1, false);

function nudge(n){ Snd.init(); const c = clamp(S.col + n, 0, maxCol() + 1); if (c !== S.col) { S.col = c; Snd.notch(true); refreshReadout(); } }

    const q = p < .08 ? 0 : (p - .08) / .92;

function flushQueue(){ /* the frame loop drains the queue one action at a time */ }
function drainQueue(){ let guard = 0; while (S.queue.length && !S.returning && S.pending === 0 && guard++ < 8) S.queue.shift()(); }
function tab(q){
  Snd.init();

  const k = keyBy('tab')[0]; pressKeyVisual(k, 120);
  const stops = [...S.tabs].filter(t => t > S.col).sort((a, b) => a - b);

  target = Math.min(target, limitCol());

  const from = S.carX, to = -paperLocalX(target), dur = .05 + Math.abs(to - from) * .009;
  S.returning = true; S.carOverride = true; S.col = target; refreshReadout(); Snd.tabRun(dur);

}
function setTab(set){
  Snd.init(); Snd.click(.4);
  const k = keyBy(set ? 'tabset' : 'tabclr')[0]; if (k) pressKeyVisual(k, 110);
  if (set) S.tabs.add(S.col); else S.tabs.delete(S.col);
  toast(set ? `Tab stop set at column ${S.col}` : (`Tab stop cleared at column ${S.col}`));
  drawBailScale(); refreshReadout();
}
function setShift(on){ if (S.shift === on) return; S.shift = on; keyBy('shift').forEach(k => k.held = on); Snd.init(); Snd.shift(on, -.3); }
function setLock(on){ if (S.lock === on) return; S.lock = on; const k = keyBy('lock')[0]; if (k) k.held = on; Snd.init(); Snd.shift(on, -.4); }
function toggleMarRel(){ S.marRel = !S.marRel; const k = keyBy('marrel')[0]; pressKeyVisual(k, 110); Snd.init(); Snd.click(-.4); refreshReadout(); toast(S.marRel ? 'Margin release: the carriage may pass the stops until the next return' : 'Margin stops engaged'); }
function roll(dir, fine){
  if (!S.paperIn || S.paperAnim) { Snd.init(); Snd.notch(fine); return; }
  Snd.init(); S.feedPx = clamp(S.feedPx + dir * (fine ? 3 : LINE_PX), -60, PH + 80); Snd.notch(fine); refreshReadout(); checkPaperEnd();
}
function checkPaperEnd(){
  if (!S.paperIn) return;
  if (S.feedPx > PH + 60) { removeSheet(true); return; }
  if (S.feedPx > PH - DPI * 0.6) toast('Nearly at the foot of the page');
}
function setRibbon(r){ S.ribbon = r; setSeg('ribbon', r); refreshReadout(); Snd.init(); Snd.lever(); }
function cycleRibbon(){ const order = ['black', 'red', 'stencil']; setRibbon(order[(order.indexOf(S.ribbon) + 1) % 3]); }
function setSpacing(v){ S.spacing = v; setSeg('spacing', v); Snd.init(); Snd.lever(); toast(`Line space ${v === 1 ? 'single' : v === 2 ? 'double' : '1½'}`); }
function cycleSpacing(){ const o = [1, 1.5, 2]; setSpacing(o[(o.indexOf(S.spacing) + 1) % 3]); }
function setPitch(cpi){
  if (cpi === S.cpi) return;
  const toCol = (c, o, n) => Math.round((c * (DPI / o) + DPI / o / 2) / (DPI / n) - .5);
  const old = S.cpi;
  S.col = toCol(S.col, old, cpi); S.leftM = toCol(S.leftM, old, cpi); S.rightM = toCol(S.rightM, old, cpi);

}

/* sheet handling */
function insertSheet(){
  if (S.paperAnim) return;
  Snd.init();
  const go = () => {
    S.paperIn = true; genPaperBase(S.paperStyle); ictx.clearRect(0, 0, PW, PH); inkDirty = false; recomposite();
    buildPath(S.paperStyle); applyPaperMaterial(); lastPaperF = NaN;
    paperMesh.visible = paperBack.visible = true;
    S.paperAnim = true; const target = DPI + LINE_PX * 0.75; S.firstLine = target;
    const start = -DPI * 1.6; S.feedVis = start; S.feedPx = target;
    Snd.paper(false);
    tween(900, p => { const e = 1 - Math.pow(1 - p, 3); S.feedVis = lerp(start, target, e); }, () => { S.paperAnim = false; S.feedVis = target; refreshReadout(); });
    S.col = S.leftM; refreshReadout();
  };
  if (S.paperIn) removeSheet(false, go); else go();
}
function removeSheet(auto, then){
  if (!S.paperIn || S.paperAnim) { then && then(); return; }
  S.paperAnim = true; const from = S.feedVis, to = PH + DPI * 7;
  Snd.paper(true);
  tween(auto ? 700 : 620, p => { S.feedVis = lerp(from, to, p * p); }, () => {
    S.paperAnim = false; S.paperIn = false; paperMesh.visible = paperBack.visible = false; S.feedPx = to; refreshReadout();
    if (auto) toast('The sheet has run out of the machine. Press New paper to keep typing.');
    then && then();
  });
}

/* ============================== photos ============================== */
// In the claude.ai viewer, saves go through the viewer's download prompt; a standalone file uses a normal download.
const downloadsNS = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
// Every save opens a preview first; nothing is downloaded until the Download button is pressed.
let preview = null, previewToken = 0; // preview: { blob, url, filename }
function offerImage(canvasEl, filename){
  const token = ++previewToken, img = $('#modalImg'), note = $('#modalNote'), btn = $('#modalDownload');
  if (preview) { URL.revokeObjectURL(preview.url); preview = null; }
  img.hidden = true; img.removeAttribute('src');
  note.textContent = 'Preparing the preview…';
  btn.disabled = true;
  $('#modal').hidden = false; $('#modalClose').focus();
  canvasEl.toBlob(blob => {
    if (token !== previewToken || $('#modal').hidden) return; // closed or replaced while encoding
    if (!blob) { note.textContent = 'Could not create the image.'; return; }
    preview = { blob, url: URL.createObjectURL(blob), filename };
    img.src = preview.url; img.hidden = false;
    note.textContent = 'This is how your page will look. Download it as a PNG image.';
    btn.disabled = false; btn.focus();
  }, 'image/png');
}
async function downloadPreview(){
  if (!preview) return;
  const { blob, url, filename } = preview, note = $('#modalNote'), btn = $('#modalDownload');
  const dl = await downloadsNS;
  if (dl) {
    btn.disabled = true;
    try { await dl.save({ filename, data: blob }); note.textContent = 'Saved.'; toast('Image saved'); }
    catch (err) {
      if (err && err.code === 'declined') note.textContent = 'Save cancelled.';
      else if (err && err.code === 'rate_limited') note.textContent = 'A save is already waiting for your answer.';
      else note.textContent = 'Saving is not available in this view. Right-click the image (or press and hold on a phone) and choose Save Image.';
    }
    btn.disabled = false;
    return;
  }
  try { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  note.textContent = 'The download has started. If nothing arrived, right-click the image (or press and hold on a phone) and choose Save Image.';
}
function sheetComposite(){ const c = mkCanvas(PW, PH), x = c.getContext('2d'); x.drawImage(paperBase, 0, 0); x.globalCompositeOperation = 'multiply'; x.drawImage(paperInk, 0, 0); return c; }
function saveScan(){ if (!S.paperIn && !hasInk()) { toast('There is no sheet in the machine. Press New paper to insert one.'); return; } offerImage(sheetComposite(), `typed-page-scan-${stamp()}.png`); }
function savePhoto(){
  if (!S.paperIn && !hasInk()) { toast('There is no sheet in the machine'); return; }
  const W = 2000, H = 2500, c = mkCanvas(W, H), x = c.getContext('2d');
  x.drawImage(wood, 0, 0, 1024, 1024, 0, 0, W, W * 1.25);
  x.fillStyle = 'rgba(8,5,3,.5)'; x.fillRect(0, 0, W, H);
  const pool = x.createRadialGradient(W * .38, H * .3, 100, W * .45, H * .45, W * .95); pool.addColorStop(0, 'rgba(255,200,140,.18)'); pool.addColorStop(1, 'rgba(0,0,0,.45)');
  x.fillStyle = pool; x.fillRect(0, 0, W, H);
  const sheet = sheetComposite(), sc = (H * .9) / PH, sw = PW * sc, shh = PH * sc;
  x.save(); x.translate(W / 2 + 10, H / 2); x.rotate(-1.1 * DEG);
  x.shadowColor = 'rgba(0,0,0,.65)'; x.shadowBlur = 70; x.shadowOffsetX = 18; x.shadowOffsetY = 30;
  x.fillStyle = '#ddd'; x.fillRect(-sw / 2, -shh / 2, sw, shh); x.shadowColor = 'transparent';
  x.drawImage(sheet, -sw / 2, -shh / 2, sw, shh);
  x.globalCompositeOperation = 'multiply';
  const lg = x.createLinearGradient(-sw / 2, -shh / 2, sw / 2, shh / 2); lg.addColorStop(0, '#fff7ea'); lg.addColorStop(.55, '#f1e8da'); lg.addColorStop(1, '#bfb4a2');
  x.fillStyle = lg; x.fillRect(-sw / 2, -shh / 2, sw, shh);
  // gentle curl from the platen near the foot of the sheet
  const curl = x.createLinearGradient(0, shh / 2 - 160, 0, shh / 2); curl.addColorStop(0, 'rgba(255,255,255,1)'); curl.addColorStop(1, 'rgba(205,196,182,1)');
  x.fillStyle = curl; x.fillRect(-sw / 2, shh / 2 - 160, sw, 160);
  x.globalCompositeOperation = 'screen';
  const hl = x.createRadialGradient(-sw * .2, -shh * .25, 20, -sw * .2, -shh * .25, sw * .9); hl.addColorStop(0, 'rgba(255,240,215,.14)'); hl.addColorStop(1, 'rgba(255,240,215,0)');
  x.fillStyle = hl; x.fillRect(-sw / 2, -shh / 2, sw, shh);
  x.restore();
  offerImage(c, `typed-page-photo-${stamp()}.png`);
}
function save3D(){ renderer.render(scene, camera); offerImage(renderer.domElement, `typewriter-${stamp()}.png`); }
let inkDirty = false; const hasInk = () => inkDirty;
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`; };

/* ============================== tweens & animation ============================== */
const tweens = [];
function tween(ms, update, done){ tweens.push({ t0: performance.now(), ms, update, done }); }
function stepTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--) { const tw_ = tweens[i]; const p = clamp((now - tw_.t0) / tw_.ms, 0, 1); tw_.update(p); if (p >= 1) { tweens.splice(i, 1); tw_.done && tw_.done(); } }
}
function stepBars(now){
  let lift = 0;
  const landed = bars.filter(b => b.phase === 'up' && now - b.t0 >= UP_MS).sort((x, y) => x.t0 - y.t0);
  for (const b of landed) { impact(b); b.phase = 'down'; b.t1 = now; b.fromAngle = 0; }
  for (const b of bars) {
    let a = b.rest;
    if (b.phase === 'up') {
      const p = (now - b.t0) / UP_MS;
      a = b.rest * (1 - p * p);
      lift = Math.max(lift, smooth(.35, .85, p) * b.ribbonLift);
    } else if (b.phase === 'down') {
      const q = (now - b.t1) / DOWN_MS, from = b.fromAngle ?? 0;
      if (q >= 1) { a = b.rest; b.phase = 'idle'; }
      else { const e = 1 - Math.pow(1 - q, 3); a = lerp(from, b.rest, e) + Math.sin(q * Math.PI) * 0.05 * (1 - q); if (from === 0) lift = Math.max(lift, (1 - smooth(0, .45, q)) * b.ribbonLift); }
    } else if (b.phase === 'jam') {
      const p = clamp((now - b.t0) / 70, 0, 1); a = lerp(b.jamFrom ?? b.rest, b.jamAt, p * (2 - p));
    }
    b.angle = a; b.swing.rotation.x = a;
  }
  RIB.liftTarget = lift; updateRibbon(false);
}
function stepKeys(dt, now){
  for (const k of keys) {
    const target = (k.held || now < k.downUntil) ? 1 : 0;
    const rate = target > k.press ? 55 : 20;
    k.press += (target - k.press) * Math.min(1, dt * rate);
    const depth = k.sp === 'space' ? 0.42 : 0.55;
    k.cap.position.y = (k.sp === 'space' ? 0 : 0) - k.press * depth;
  }
}
function stepCarriage(dt, now){
  const targetX = -paperLocalX(Math.min(S.col, maxCol() + 1));
  if (!S.carOverride) S.carX += (targetX - S.carX) * Math.min(1, dt * 38);
  const sh_ = (shiftOn() || now < S.autoShiftUntil) ? 1 : 0;
  S.shiftVis += (sh_ - S.shiftVis) * Math.min(1, dt * 30);
  carriage.position.set(S.carX, S.shiftVis * 0.4, 0);
  if (!S.paperAnim) S.feedVis += (S.feedPx - S.feedVis) * Math.min(1, dt * 22);
  const f = feedCm(S.feedVis);
  if (S.paperIn) updatePaperGeom(f);
  platenRot.rotation.x = -f / PLATEN.r;
  lineLever.rotation.z = (S.spacing - 1.5) * 0.5;
  releaseLever.rotation.x = S.paperAnim ? -0.4 : 0;
  ribbonLever.rotation.y += (RIBBON_ANGLE[S.ribbon] - ribbonLever.rotation.y) * Math.min(1, dt * 20);
}

/* ============================== camera ============================== */
let controls;
const VIEWS = {
  typist: { pos: [0, 44, 60], tgt: [0, 10.5, -1.5] },
  paper:  { pos: [0, 27, 16], tgt: [0, 17, -8] },
  side:   { pos: [-58, 30, 30], tgt: [0, 10, -2] },
  top:    { pos: [0, 82, 9], tgt: [0, 9, -1] }
};
function viewFor(name){
  const v = VIEWS[name], aspect = camera.aspect, k = aspect < 1.2 ? Math.min(2.1, Math.pow(1.35 / aspect, 0.85)) : 1;
  const tgt = new T.Vector3(...v.tgt), pos = new T.Vector3(...v.pos).sub(tgt).multiplyScalar(k).add(tgt);
  return { pos, tgt };
}
function goView(name, instant){
  S.view = name; setSeg('view', name);
  const { pos, tgt } = viewFor(name);
  if (instant) { camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  tween(900, p => { const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; camera.position.lerpVectors(p0, pos, e); controls.target.lerpVectors(t0, tgt, e); });
}
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}

/* ============================== pointer input ============================== */
const ray = new T.Raycaster(), ndc = new T.Vector2();
function pick(ev){
  const r = canvas.getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  for (const h of hits) { if (h.object.visible && h.object.userData.type) return h; }
  return null;
}
let drag = null;
function onPointerDown(ev){
  Snd.init();
  const h = pick(ev); if (!h) return;
  const u = h.object.userData, t = u.type;
  if (t === 'paper') return; // let the camera orbit
  controls.enabled = false; ev.preventDefault();
  if (t === 'key') {
    const k = u.key;
    if (k.sp === 'space') space();
    else if (k.sp === 'back') backspace();
    else if (k.sp === 'tab') tab();
    else if (k.sp === 'shift') { setShift(true); drag = { type: 'shift' }; }
    else if (k.sp === 'lock') setLock(!S.lock);
    else if (k.sp === 'marrel') toggleMarRel();
    else if (k.sp === 'tabset') setTab(true);
    else if (k.sp === 'tabclr') setTab(false);
    else typeChar(shiftOn() ? k.hi : k.lo, 'click');
  } else if (t === 'return') carriageReturn(true);
  else if (t === 'knob') drag = { type: 'knob', y: ev.clientY, acc: 0 };
  else if (t === 'ribbonSel') cycleRibbon();
  else if (t === 'lineSpace') cycleSpacing();
  else if (t === 'release') { S.paperIn ? removeSheet(false) : insertSheet(); }
  else if (t === 'bar') { if (S.jammed) clearJam(); }
}
canvas.addEventListener('pointerdown', onPointerDown, true);
window.addEventListener('pointermove', ev => {
  if (drag && drag.type === 'knob') { drag.acc += ev.clientY - drag.y; drag.y = ev.clientY; while (Math.abs(drag.acc) >= 16) { const s = Math.sign(drag.acc); roll(s, ev.altKey); drag.acc -= s * 16; } return; }
  hoverEv = ev;
});
window.addEventListener('pointerup', () => { if (drag && drag.type === 'shift') setShift(false); drag = null; if (controls) controls.enabled = true; });
let hoverEv = null;
let wheelAcc = 0;
canvas.addEventListener('wheel', ev => {
  const h = pick(ev); if (!h) return; const t = h.object.userData.type;
  if (t === 'paper' || t === 'knob') {
    ev.preventDefault(); ev.stopImmediatePropagation(); Snd.init();
    wheelAcc += ev.deltaY * (ev.deltaMode === 1 ? 30 : 1);
    while (Math.abs(wheelAcc) >= 50) { const s = Math.sign(wheelAcc); roll(s, ev.altKey); wheelAcc -= s * 50; }
  }
}, { capture: true, passive: false });

/* ============================== keyboard input ============================== */
const isField = el => el && el !== $('#softkb') && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
window.addEventListener('keydown', e => {
  if (isField(e.target)) return;
  if (e.metaKey || e.ctrlKey) return;
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (e.target === $('#softkb') && e.key.length === 1) return; // handled by input events
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (typeof e.getModifierState === 'function') { const caps = e.getModifierState('CapsLock'); if (caps !== S.lock && e.key !== 'CapsLock') setLock(caps); }
  const k = e.key;
  if (k === 'Shift') { e.preventDefault(); if (!e.repeat) setShift(true); return; }
  if (k === 'CapsLock') { setLock(e.getModifierState ? e.getModifierState('CapsLock') : !S.lock); return; }
  if (e.repeat && !k.startsWith('Arrow')) { e.preventDefault(); return; }
  let handled = true;
  switch (k) {
    case 'Enter': carriageReturn(true); break;
    case 'Backspace': backspace(); break;
    case 'Tab': tab(); break;
    case ' ': space(); break;
    case 'Escape': clearJam(); break;
    case 'ArrowUp': roll(-1, e.altKey); break;
    case 'ArrowDown': roll(1, e.altKey); break;
    case 'ArrowLeft': nudge(-1); break;
    case 'ArrowRight': nudge(1); break;
    default:
      if (k.length === 1) { if (CHARMAP[k]) typeChar(k, 'kbd'); else { Snd.init(); Snd.locked(0); } }
      else handled = false;
  }
  if (handled) e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') setShift(false);
  if (e.key === 'CapsLock' && typeof e.getModifierState === 'function') setLock(e.getModifierState('CapsLock'));
});
window.addEventListener('blur', () => setShift(false));

// touch keyboards
const softkb = $('#softkb');
function softType(str){ Snd.init(); for (const c of str) S.queue.push(c === '\n' ? () => carriageReturn(true, true) : c === ' ' ? () => space(true) : () => typeChar(c, 'queue')); }
softkb.addEventListener('beforeinput', e => {
  if (e.inputType === 'insertText' && e.data) { e.preventDefault(); softType(e.data); }
  else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { e.preventDefault(); carriageReturn(true); }
  else if (e.inputType === 'deleteContentBackward') { e.preventDefault(); backspace(); }
});
softkb.addEventListener('input', () => { const v = softkb.value; if (v) { softkb.value = ''; softType(v); } });
$('#kbBtn').addEventListener('click', () => { Snd.init(); softkb.focus(); });


/* ============================== page controls ============================== */
function closeModal(){
  $('#modal').hidden = true;
  previewToken++;
  if (preview) { URL.revokeObjectURL(preview.url); preview = null; $('#modalImg').removeAttribute('src'); }
  canvas.focus({ preventScroll: true });
}
$('#modalClose').addEventListener('click', closeModal);
$('#modalDownload').addEventListener('click', downloadPreview);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#saveScanBtn').addEventListener('click', e => { saveScan(); e.currentTarget.blur(); });
// a typed page needs a second click before it is thrown away
let newPaperArm = 0;
function disarmNewPaper(){ clearTimeout(newPaperArm); newPaperArm = 0; const b = $('#newPaperBtn'); b.textContent = 'New paper'; b.classList.remove('warn'); }
$('#newPaperBtn').addEventListener('click', e => {
  const b = e.currentTarget; b.blur();
  if (S.paperAnim) return;
  if (hasInk() && !newPaperArm) {
    newPaperArm = setTimeout(disarmNewPaper, 3000);
    b.textContent = 'Discard page?'; b.classList.add('warn');
    toast('Click again to discard this page. Save it first if you want to keep it.');
    return;
  }
  disarmNewPaper(); insertSheet();
});
let hintGone = false;
function hideHint(){ if (hintGone) return; hintGone = true; $('#hint').classList.add('gone'); }
window.addEventListener('keydown', hideHint);
canvas.addEventListener('pointerdown', hideHint);

/* ============================== boot ============================== */
function typeInstant(text){
  for (const ch of text) {
    if (ch === '\n') { S.col = S.leftM; S.feedPx += LINE_PX; continue; }
    if (ch !== ' ') printGlyph(ch, S.col, S.feedPx, { noComposite: true, strength: rand(.86, 1) });
    S.col++;
  }
}
function boot(){
  decalApron(); decalSides();
  buildKeyboard(); buildTypebars(); buildRibbon(); buildRibbonSelector(); buildCarriage(); buildPaper();
  updateFontMetrics();
  genPaperBase(S.paperStyle); buildPath(S.paperStyle); applyPaperMaterial();
  // a sheet already rolled in, with a few lines on it
  const first = DPI + LINE_PX * 0.75; S.feedPx = first; S.firstLine = first; S.col = S.leftM;
  recomposite(); inkDirty = false;
  S.feedVis = S.feedPx; S.carX = -paperLocalX(S.col);
  drawBailScale(); refreshReadout();
  controls = new T.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = 12; controls.maxDistance = 110;
  controls.maxPolarAngle = 1.48; controls.minPolarAngle = .12; controls.screenSpacePanning = true; controls.rotateSpeed = .6;
  resize(); goView('typist', true);  window.addEventListener('resize', resize);
  let last = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    stepTweens(now); stepBars(now); drainQueue(); stepKeys(dt, now); stepCarriage(dt, now);
    if (hoverEv && !drag) { const h = pick(hoverEv); const t = h && h.object.userData.type; canvas.style.cursor = t && t !== 'paper' ? (t === 'knob' ? 'ns-resize' : 'pointer') : 'grab'; hoverEv = null; }
    controls.update(); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => { $('#loader').classList.add('gone'); setTimeout(() => $('#loader').hidden = true, 700); canvas.focus({ preventScroll: true }); }, 150);
}
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load('33px "Special Elite"'), document.fonts.load('33px "Courier Prime"'), document.fonts.load('700 40px "Courier Prime"')]),
  new Promise(r => setTimeout(r, 3500))
]) : Promise.resolve();
fontsReady.then(boot, boot);
})();
